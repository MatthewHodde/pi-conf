title = "scan-secrets rules"

[extend]
useDefault = true

[[rules]]
id = "env-credential"
description = ".env-style credential assignment"
regex = '''(?i)(password|passwd|secret|token|api_?key)\s*[:=]\s*["']?([A-Za-z0-9_\-]{8,})'''
secretGroup = 2
entropy = 0.5 # rejects all-same-character values, which score entropy 0
keywords = ["password", "passwd", "secret", "token", "api_key", "apikey"]
scope = "content"

# ${VAR}, {{VAR}} and <VAR> values never match the rule regex, because the
# value class holds no $ { } < > characters. This allowlist drops the
# placeholder words changeme, example and xxx.
[[rules.allowlists]]
description = "placeholder credential values"
regexTarget = "secret"
regexes = ['''(?i)^(changeme|example|x{3,})''']

[[rules]]
id = "bearer-token"
description = "Authorization bearer header value"
regex = '''(?i)authorization\s*[:=]\s*["']?bearer\s+([A-Za-z0-9._\-]{16,})'''
secretGroup = 1
keywords = ["authorization"]
scope = "content"
